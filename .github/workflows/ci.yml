name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marthub
          POSTGRES_PASSWORD: marthub_test
          POSTGRES_DB: marthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marthub -d marthub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marthub:marthub_test@127.0.0.1:5432/marthub_test
      NEXT_TELEMETRY_DISABLED: '1'
      MARTHUB_E2E_RESET_DATABASE: '1'
      WEB_ORIGIN: http://127.0.0.1:13000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/test/e2e-database.test.js
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
